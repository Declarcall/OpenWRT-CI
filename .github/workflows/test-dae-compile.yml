# 专用于快速定位单包编译失败的轻量测试工作流
name: TEST-DAE-COMPILE

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: write-all

concurrency:
  group: test-dae-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  test-dae:
    name: Test dae compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Free Disk Space & Init Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium /usr/local/share/boost /usr/lib/jvm /var/lib/docker /var/lib/containerd
          sudo -E apt-get update -y
          sudo -E apt-get install -y --no-install-recommends dos2unix libfuse-dev clang llvm lld gawk gettext libncurses-dev libssl-dev zlib1g-dev libelf-dev python3-pyelftools python3-setuptools
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

          echo "=== Host clang version ==="
          clang --version
          echo "=== Host llvm version ==="
          llvm-config --version || true
          echo "=== libelf check ==="
          dpkg -l | grep libelf || true

      - name: Clone ImmortalWRT
        run: |
          git clone --depth=1 --single-branch --branch main https://github.com/VIKINGYFY/immortalwrt.git ./wrt/
          cd ./wrt/ && echo "Source cloned: $(git log -1 --pretty=format:'%h %s')"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Apply Config & Defconfig
        env:
          WRT_THEME: aurora
          WRT_NAME: ARTHUR
          WRT_SSID: ARTHUR
          WRT_WORD: "12345678"
          WRT_IP: "192.168.10.1"
          WRT_PW: "none"
        run: |
          cd ./wrt/

          cat $GITHUB_WORKSPACE/Config/JDC-ARTHUR.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          $GITHUB_WORKSPACE/Scripts/Settings.sh
          make defconfig -j$(nproc)

          echo "=== .config dae-related entries ==="
          grep -i "dae\|bpf\|btf\|clang\|ebpf" .config || true

      - name: Download dae Dependencies
        run: |
          cd ./wrt/
          export GOPROXY=https://proxy.golang.org,direct
          make package/luci-app-dae/dae/download V=s 2>&1 | tail -n 50

      - name: Cache Toolchain & Host Tools
        uses: actions/cache@v4
        with:
          key: test-dae-toolchain-${{ runner.os }}-${{ hashFiles('Config/JDC-ARTHUR.txt') }}
          restore-keys: |
            test-dae-toolchain-${{ runner.os }}-
          path: |
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Compile Host Tools, Target Toolchain & Kernel
        run: |
          cd ./wrt/
          make tools/compile -j$(nproc) || make tools/compile -j1 V=s
          make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s

      - name: Compile dae (V=s Full Verbose)
        id: compile_dae
        continue-on-error: true
        run: |
          set -o pipefail
          cd ./wrt/
          export GOPROXY=https://proxy.golang.org,direct
          make package/luci-app-dae/dae/compile V=s 2>&1 | tee /tmp/dae_build.log

      - name: Upload Build Log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dae-build-log
          path: /tmp/dae_build.log
          retention-days: 7

      - name: Commit Failure Log to Repo
        if: steps.compile_dae.outcome == 'failure'
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/logs/build_failures"
          mkdir -p "$LOG_DIR"
          TIMESTAMP=$(TZ=UTC-8 date +"%Y-%m-%d_%H-%M-%S")
          LOG_FILE="$LOG_DIR/dae_failure_${TIMESTAMP}.log"

          echo "=== DAE BUILD FAILURE LOG ===" > "$LOG_FILE"
          echo "Timestamp: $TIMESTAMP" >> "$LOG_FILE"
          echo "Commit: $GITHUB_SHA" >> "$LOG_FILE"
          echo "=============================" >> "$LOG_FILE"
          echo "" >> "$LOG_FILE"

          if [ -f "/tmp/dae_build.log" ]; then
            cat /tmp/dae_build.log >> "$LOG_FILE"
          fi

          find "$LOG_DIR" -type f -mtime +7 -delete 2>/dev/null || true

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$LOG_DIR"
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci(logs): dae build failure log [$TIMESTAMP]" && git push origin dev)

      - name: Print Failure Summary
        if: steps.compile_dae.outcome == 'failure'
        run: |
          echo "============================================"
          echo "=== DAE COMPILATION FAILED - LAST 100 LINES ==="
          echo "============================================"
          tail -n 100 /tmp/dae_build.log 2>/dev/null || echo "No log file found"
          exit 1
